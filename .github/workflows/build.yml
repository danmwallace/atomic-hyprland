# Builds, tests and (off pull requests) publishes and signs the image.
# Every step calls a just recipe so a CI failure reproduces locally.
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to a branch or PR cancels its running build. Runs on main
# (pushes and nightlies) are never cancelled: a cancel between push and sign
# would leave an unsigned tag behind.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/danmwallace/atomic-hyprland

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ~20 GB free by default; the image is 8 GB on a 6 GB base and buildah
      # keeps both. Drop toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.57.0"

      - name: Lint CI files
        run: just lint-ci

      - name: Version
        run: echo "IMAGE_VERSION=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Kernel match
        run: just check-kernel

      - name: Build
        run: just build

      - name: Test
        run: just test

      # first = the unique tag (44-<version> or dev-<branch>), rest = 44 latest
      # on main, empty elsewhere.
      - name: Tags
        id: tags
        if: github.event_name != 'pull_request'
        run: |
          mapfile -t tags < <(build/ci-tags.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$IMAGE_VERSION")
          echo "first=${tags[0]}" >> "$GITHUB_OUTPUT"
          echo "rest=${tags[*]:1}" >> "$GITHUB_OUTPUT"

      # podman writes its credentials under $XDG_RUNTIME_DIR, which cosign
      # does not read; docker login writes ~/.docker/config.json, which podman,
      # skopeo and cosign all read. Both, as ublue does.
      - name: Login to ghcr
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Push the unique tag first and sign it; 44 and latest are re-pointed
      # only after the signature exists, so no release tag ever names an
      # unsigned digest. Re-tagging the same manifest keeps the digest, so the
      # one signature covers all three.
      - name: Push version tag
        if: github.event_name != 'pull_request'
        env:
          FIRST: ${{ steps.tags.outputs.first }}
        run: build/ci-push.sh "$IMAGE" "$FIRST"

      # Pinned: bootc, podman and rpm-ostree cannot read cosign 3's new bundle
      # format yet; the sign recipe uses the legacy flags.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          FIRST: ${{ steps.tags.outputs.first }}
        run: just sign "$FIRST"

      - name: Push release tags
        if: github.event_name != 'pull_request' && steps.tags.outputs.rest != ''
        env:
          REST: ${{ steps.tags.outputs.rest }}
        run: |
          # shellcheck disable=SC2086  # REST is a space-separated list of tags
          build/ci-push.sh "$IMAGE" $REST
