---
- name: Render the Hyprland desktop into the image
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: danmwallace.fedora.hyprland
      vars:
        # $USER is unset inside podman build; the role's default would fail.
        hyprland_user: root
        hyprland_home_dir: /etc/skel
        hyprland_manage_copr: false
        hyprland_manage_services: false
        # Shipped by desktop-backgrounds-basic; a fresh home has no ~/Pictures.
        hyprland_wallpaper: /usr/share/backgrounds/images/earth_from_space.jpg
        hyprland_lock_wallpaper: /usr/share/backgrounds/images/earth_from_space.jpg
