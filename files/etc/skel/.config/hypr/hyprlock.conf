# Image-managed. Colours from the theme; your changes go in hyprlock.local.conf.
source = ~/.config/atomic-hyprland/current/theme/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 2, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/atomic-hyprland/current/background
    blur_passes = 0
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = FiraCode Nerd Font
    color = $foreground
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 16
    font_family = FiraCode Nerd Font
    color = $foreground_dim
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    rounding = 3
    inner_color = $background_alt
    outer_color = $accent
    check_color = $accent_dim
    fail_color = $critical
    font_color = $foreground
    font_family = FiraCode Nerd Font
    placeholder_text =
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

source = ~/.config/hypr/hyprlock.local.conf
