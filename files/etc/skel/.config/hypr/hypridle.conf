# Image-managed. Lock after 5 min, screen off after 10, suspend after 20 on
# battery only; lock before sleep. Your changes go in hypridle.local.conf.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1200
    on-timeout = sh -c 'grep -qs Discharging /sys/class/power_supply/BAT*/status && systemctl suspend'
}

source = ~/.config/hypr/hypridle.local.conf
