# Image-managed. Lock after 5 min, screen off after 10, suspend after 20 on
# battery only; lock before sleep. Your changes go in hypridle.local.conf.
# Dispatchers are Lua (Hyprland 0.57+), and dpms takes a table: a bare "on"/"off"
# string toggles. After sleep the panel is cycled off and on, because an NVIDIA
# panel can wake with a display pipe that rejects every frame until a fresh modeset.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' && sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1200
    on-timeout = sh -c 'grep -qs Discharging /sys/class/power_supply/BAT*/status && systemctl suspend'
}

source = ~/.config/hypr/hypridle.local.conf
