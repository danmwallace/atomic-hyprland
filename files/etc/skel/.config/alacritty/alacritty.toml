# Image-managed. Colours come from the theme import; your settings go in local.toml.
[general]
import = ["~/.config/atomic-hyprland/current/theme/alacritty.toml", "~/.config/alacritty/local.toml"]
live_config_reload = true

[window]
padding = { x = 8, y = 8 }
decorations = "None"
dynamic_padding = false

[font]
size = 11
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[terminal.shell]
program = "/usr/bin/elvish"
