# Image-managed. Alacritty loads the importing file last, so this file holds no
# settings of its own: defaults, then the theme, then your local.toml (wins).
[general]
import = ["/usr/share/atomic-hyprland/alacritty/core.toml", "~/.config/atomic-hyprland/current/theme/alacritty.toml", "~/.config/alacritty/local.toml"]
