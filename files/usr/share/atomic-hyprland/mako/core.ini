# mako geometry and behaviour, shared by every theme (colours come from the
# rendered mako.ini that includes this file).
font=FiraCode Nerd Font 11
width=360
height=120
padding=10
margin=46,12,0,0
border-size=1
border-radius=3
anchor=top-right
default-timeout=6000
ignore-timeout=0
max-visible=5
layer=overlay
icons=1
max-icon-size=32
# Agent cards are plain text, so a crafted title cannot hide the real command.
[app-name=hypr-agent]
markup=0
# Room for an answer or a command: the default 120 px cut them off after four lines.
width=480
height=320
[urgency=critical]
default-timeout=0
# `makoctl mode -t do-not-disturb` (the bar's bell) hides notifications; they queue for later.
[mode=do-not-disturb]
invisible=1
