# atomic-hyprland Alacritty defaults. Imported first by ~/.config/alacritty/alacritty.toml;
# the theme file and your ~/.config/alacritty/local.toml are imported after it and win.
[general]
live_config_reload = true

[window]
padding = { x = 8, y = 8 }
decorations = "None"
dynamic_padding = false

[font]
size = 11
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
# FiraCode has no italic face: no style here, so fontconfig slants the regular one.
italic = { family = "FiraCode Nerd Font" }
