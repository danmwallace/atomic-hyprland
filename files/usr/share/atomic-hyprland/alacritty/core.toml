# atomic-hyprland Alacritty defaults. Imported first by ~/.config/alacritty/alacritty.toml;
# the theme file and your ~/.config/alacritty/local.toml are imported after it and win.
[general]
live_config_reload = true

[window]
padding = { x = 8, y = 8 }
decorations = "None"
dynamic_padding = false

[font]
size = 11
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
